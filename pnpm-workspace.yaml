# Satisfy the @anthropic-ai/claude-agent-sdk@0.3.207 peer (>=0.93.0); the
# transitive @anthropic-ai/sdk otherwise resolves to 0.81.0. Pinned to the
# latest at time of upgrade so the read schemas track the current SDK shape.
overrides:
  '@anthropic-ai/sdk': 0.135.0

peerDependencyRules:
  allowedVersions:
    # @effect/vitest 0.29 works with Vitest 4 despite declaring a Vitest 3 peer.
    '@effect/vitest>vitest': '4'

allowBuilds:
  '@evilmartians/lefthook': false
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  msgpackr-extract: false
  node-pty: true
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.301'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.301'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.301'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.301'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.301'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.301'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.301'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.301'
  - '@anthropic-ai/claude-agent-sdk@0.3.301'
  - '@anthropic-ai/sdk@0.135.0'
  - '@opencode-ai/sdk@1.19.1'
