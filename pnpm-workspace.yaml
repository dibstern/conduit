# Satisfy the @anthropic-ai/claude-agent-sdk@0.3.325 peer (>=0.93.0); the
# transitive @anthropic-ai/sdk otherwise resolves to 0.81.0. Pinned to the
# latest at time of upgrade so the read schemas track the current SDK shape.
overrides:
  '@anthropic-ai/sdk': 1.8.0

# The SDK searches ancestors of the runner entry, not its own import location.
publicHoistPattern:
  - '@cursor/sdk-*'

allowBuilds:
  '@evilmartians/lefthook': false
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  msgpackr-extract: false
  node-pty: true
  # Its postinstall links the platform server binary that tests run.
  opencode-ai: true
  protobufjs: false
  sharp: false
