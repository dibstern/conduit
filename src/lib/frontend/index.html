<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Conduit">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#18181B">
  <title>Conduit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/file-icons-js@1/css/style.css">
  <script>
(()=>{var m,d;try{m=localStorage.getItem("conduit-theme");d=m!=="light"&&(m!=="system"||matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.add(d?"dark-theme":"light-theme")}catch(_e){document.documentElement.classList.add("dark-theme")}})();
</script>
  <link rel="stylesheet" href="/style.css">
  <script>
// Sync browser chrome to the resolved theme before the app module runs. Must sit
// AFTER style.css: the class-applying script above runs before it, so --color-bg
// is not readable there, and the meta tag would stay dark until initTheme() ran.
(()=>{var b,m;try{b=getComputedStyle(document.documentElement).getPropertyValue("--color-bg").trim();m=document.querySelector('meta[name="theme-color"]');if(b&&m)m.content=b}catch(_e){}})();
</script>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/favicon-96x96.png" sizes="96x96" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/file-icons-js@1/dist/file-icons.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app-entry.ts"></script>
</body>
</html>
