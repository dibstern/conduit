<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- `black-translucent` does nothing here and is not worth retrying: measured
       on iOS 26, an installed PWA still gets a web view inset below the status
       bar (innerHeight 793 vs screen 852) and env(safe-area-inset-top) 0, the
       same as `default`. viewport-fit=cover above is still load-bearing, but
       only for the BOTTOM inset, which is what keeps the composer clear of the
       home indicator. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Conduit">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0e11">
  <title>Conduit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/file-icons-js@1/css/style.css">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("conduit-theme");
        const shouldUseDarkTheme =
          theme !== "light" &&
          (theme !== "system" || matchMedia("(prefers-color-scheme: dark)").matches);

        document.documentElement.classList.add(
          shouldUseDarkTheme ? "dark-theme" : "light-theme",
        );
      } catch {
        // Storage or browser APIs can be unavailable during bootstrap.
        document.documentElement.classList.add("dark-theme");
      }
    })();
</script>
  <link rel="stylesheet" href="/style.css">
  <script>
// Sync browser chrome to the resolved theme before the app module runs. Must sit
// AFTER style.css: the class-applying script above runs before it, so --color-bg
// is not readable there, and the meta tag would stay dark until initTheme() ran.
    (() => {
      try {
        const backgroundColor = getComputedStyle(document.documentElement)
          .getPropertyValue("--color-bg")
          .trim();
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');

        if (backgroundColor && themeColorMeta) {
          themeColorMeta.content = backgroundColor;
        }
      } catch {
        // Browser APIs can be unavailable during bootstrap.
      }
    })();
</script>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/favicon-96x96.png" sizes="96x96" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/file-icons-js@1/dist/file-icons.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app-entry.ts"></script>
</body>
</html>
