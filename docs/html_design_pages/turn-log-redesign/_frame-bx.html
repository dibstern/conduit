<!doctype html><html><head><meta charset="utf-8"><script>(()=>{let t;try{t=parent!==window&&parent.document.documentElement.dataset.designTheme}catch(e){}t=t||localStorage.getItem('tsp-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const h=document.documentElement;h.dataset.theme=t;h.style.setProperty('color-scheme',t,'important')})()</script><style>body{margin:0}html:not([data-theme=dark]) [data-theme-only=dark],html[data-theme=dark] [data-theme-only=light]{display:none!important}</style><meta name="viewport" content="width=390">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:light-dark(#fff,#111113); --turn-bg:light-dark(#f4f4f6,#1a1a1d);
  --text:light-dark(#0b0b0d,#ededf0); --text2:light-dark(#5d5d66,#a1a1aa); --dim:light-dark(#868692,#6e6e77);
  --border:light-dark(#e3e3e7,#2b2b31); --chip:light-dark(rgba(0,0,0,.05),rgba(255,255,255,.07)); --sel:light-dark(#ececef,#202024);
  --explore:light-dark(#0369a1,#38bdf8); --edit:light-dark(#a87e00,#d9a521); --shell:light-dark(#15803d,#4ade80);
  --other:light-dark(#3f40b2,#6366f1); --thinking:light-dark(#7441ff,#b07cff); --textc:light-dark(#c0267f,#f472b6);
  --fail:light-dark(#ff3b62,#ff4f73); --error:light-dark(#bc1f1f,#ff6369); --accent:light-dark(#4352d2,#8e9bff);
  --success:light-dark(#127136,#3ecf8e);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Geist,system-ui,sans-serif;padding:22px 30px 8px}
body.phone{padding:18px 14px 6px}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
svg.lucide{width:14px;height:14px;stroke-width:2}
.sm svg.lucide,svg.lucide.sm{width:12px;height:12px}
.state{margin-bottom:26px}
.lbl{font:600 10.5px/1 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.card{background:var(--turn-bg);border-radius:14px;padding:10px 12px 10px}
.hl{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.hl .w{font-size:14px;font-weight:600}
.hl .dur{font:12px "Geist Mono",monospace;color:var(--dim)}
.hl .ph{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;min-width:0}
.hl .chev{color:var(--dim);display:flex}
.spin{color:var(--accent);display:flex;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.strip{display:flex;gap:2px;height:4px;margin-top:9px}
.strip i{display:block;height:100%;border-radius:2px;transition:opacity .2s}
.strip i.seam{flex:0 0 2px!important;background:var(--text2);height:10px;margin-top:-3px}
.strip i.live{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.log{margin-top:6px}
.row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;min-height:26px}
.row .ic{flex:none;display:flex}
.row .verb{color:var(--text2);flex:none}
.row .subj{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px "Geist Mono",monospace;color:var(--dim)}
.row .subj.it{font:italic 13px Geist,sans-serif}
.row .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic;color:var(--text2)}
.row time{margin-left:auto;font:11.5px "Geist Mono",monospace;color:var(--dim);flex:none}
.blk{width:9px;height:9px;flex:none;background:repeating-linear-gradient(90deg,var(--accent) 0 1.5px,transparent 1.5px 2.5px);animation:breathe .6s steps(2) infinite}
.rule{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;color:var(--dim)}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:var(--border)}
.bill{font:12px "Geist Mono",monospace;color:var(--text2);display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.bill .sep{color:var(--dim)}
.gauge{display:inline-block;width:40px;height:4px;border-radius:9px;background:var(--chip);overflow:hidden;vertical-align:middle}
.gauge b{display:block;height:100%;width:41%;background:var(--success)}
.earlier{font-size:12px;color:var(--text2);padding:8px 6px}
.flag{outline:1.5px dashed var(--fail);outline-offset:3px;border-radius:6px}
.note{font-size:11.5px;color:var(--fail);margin:7px 0 0 2px;display:flex;gap:6px;align-items:baseline}
.note b{font:600 10.5px "Geist Mono",monospace;background:var(--fail);color:#fff;border-radius:99px;padding:0 6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;background:var(--chip);color:var(--text2);font-size:12px;font-weight:500;border:0}
.pill.on{background:color-mix(in srgb,var(--other) 18%,transparent);color:var(--other)}
.pill.err{color:var(--error);background:color-mix(in srgb,var(--error) 12%,transparent)}
/* B: skill chapters */
.chap{display:flex;align-items:center;gap:7px;padding:7px 6px 4px;margin-top:2px;border-radius:6px}
.chap.hov{background:var(--sel)}
.chap .cn{font:500 12.5px "Geist Mono",monospace;color:var(--text)}
.chap .ct{font-size:11px;color:var(--dim)}
.chap .cm{margin-left:auto;font:11.5px "Geist Mono",monospace;color:var(--dim)}
.rail{margin-left:12px;padding-left:4px;border-left:2px solid color-mix(in srgb,var(--other) 40%,transparent)}
.totals{display:flex;justify-content:flex-end;align-items:center;gap:10px;border-top:1px solid var(--border);margin-top:8px;padding:8px 6px 2px}
.phone .totals{justify-content:flex-start}
</style>
<script>
const K={skill:['sparkles','--other','Loaded'],think:['brain','--thinking','Thought'],read:['file-text','--explore','Read'],search:['search','--explore','Searched'],edit:['pencil','--edit','Edited'],bash:['terminal','--shell','Ran'],msg:['message-square','--textc','']};
const STEPS=[
 {k:'think',text:'They want the log redesigned; load tsp, then find the component',d:'4s',w:5},
 {k:'skill',subj:'tsp',d:'380ms',w:1,ch:'tsp'},
 {k:'read',subj:'chat/TurnActivity.svelte',d:'31ms',w:2,ch:'tsp'},
 {k:'search',subj:'"Loaded" in src/lib/frontend',d:'210ms',w:3,ch:'tsp'},
 {k:'read',subj:'chat/ActivityRow.svelte',d:'22ms',w:2,ch:'tsp'},
 {k:'msg',text:'The footer reuses the row indent and icon, so it reads as a step.',d:'3s',w:8,ch:'tsp'},
 {k:'skill',subj:'brainstorm',d:'290ms',w:1,ch:'brainstorm'},
 {k:'edit',subj:'chat/TurnActivity.svelte',d:'1s',w:5,ch:'brainstorm'},
 {k:'bash',subj:'pnpm check',d:'38s',w:18,fail:1,ch:'brainstorm'},
 {k:'bash',subj:'pnpm check',d:'41s',w:20,ch:'brainstorm'},
 {k:'compact',ch:'brainstorm'},
 {k:'edit',subj:'chat/ActivityRow.svelte',d:'900ms',w:6,ch:'brainstorm'},
];
const LIVE=STEPS.slice(0,10);
const PHRASE='2 reads · 1 search · 2 edits · 2 commands';
const ico=(n,c,cls='')=>`<span class="ic ${cls}" style="color:var(${c})"><i data-lucide="${n}"></i></span>`;
function row(s,o={}){
 if(s.k==='compact')return `<div class="rule"><span>Compacted context</span><span class="mono">182k → 41k</span><span>·</span><span style="color:var(--text2);font-weight:500">141k saved</span></div>`;
 const [n,c,v]=K[s.k];
 const col=s.fail?'--fail':o.live?'--accent':c;
 const tail=o.live?'<span class="blk"></span>':s.fail?ico('circle-alert','--error','sm'):'';
 if(s.k==='think')return `<div class="row">${ico(n,col)}<span class="verb" style="font-weight:500">Thought</span><span class="subj it">${s.text}</span><time>${s.d}</time></div>`;
 if(s.k==='msg')return `<div class="row">${ico(n,col)}<span class="msg">${s.text}</span><time>${s.d}</time></div>`;
 return `<div class="row">${ico(n,col)}<span class="verb">${o.live?'Running':(o.verb??v)}</span><span class="subj">${s.subj}</span>${o.live?'':`<time>${s.d}</time>`}${tail}</div>`;
}
function strip(steps,o={}){
 return `<div class="strip">${steps.map((s,i)=>{
  if(s.k==='compact')return '<i class="seam"></i>';
  const live=o.live&&i===steps.length-1;
  const col=s.fail?'--fail':live?'--accent':K[s.k][1];
  const dim=o.emph&&s.ch!==o.emph?';opacity:.22':'';
  return `<i class="${live?'live':''}" style="flex:${s.w} 1 0;background:var(${col})${dim}"></i>`}).join('')}</div>`;
}
function head(o={}){
 const lead=o.live?`<span class="spin"><i data-lucide="loader-circle"></i></span><span class="w">Working</span><span class="dur">1m 31s</span>`
  :`<span class="chev"><i data-lucide="${o.open?'chevron-down':'chevron-right'}"></i></span><span class="w">Worked</span><span class="dur">4m 12s</span>`;
 return `<div class="hl">${lead}<span class="ph">· ${o.phrase??PHRASE}</span></div>`;
}
const BILL=`<span class="bill"><span>$0.4123</span><span class="sep">·</span><span>1.2M in</span><span class="sep">·</span><span>18k out</span><span class="sep">·</span><span>ctx <span class="gauge"><b></b></span> 41%</span></span>`;
function state(label,html,note=''){return `<div class="state"><div class="lbl">${label}${note?`<em>${note}</em>`:''}</div>${html}</div>`}
function mount(html){const d=document.createElement('div');d.innerHTML=html;document.body.prepend(d);lucide.createIcons();}
</script>
</head><body>
<script>
document.body.classList.add('phone');
const ch=(n,m)=>`<div class="chap">${ico('sparkles','--other')}<span class="cn">${n}</span><span class="ct">skill</span><span class="cm">${m}</span></div>`;
mount(
 state('Collapsed',`<div class="card">${head({phrase:PHRASE+' · 2 skills'})}${strip(STEPS)}</div>`)+
 state('Expanded',`<div class="card">${head({open:1,phrase:PHRASE+' · 2 skills'})}${strip(STEPS)}</div><div class="log">${row(STEPS[0])}
  ${ch('tsp','1m 12s')}<div class="rail">${STEPS.slice(2,6).map(s=>row(s)).join('')}</div>
  ${ch('brainstorm','3m 0s')}<div class="rail">${STEPS.slice(7).map(s=>row(s)).join('')}</div>
  <div class="totals">${BILL}</div></div>`)
);
</script>
</body></html>
