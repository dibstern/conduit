<script>
const K={skill:['sparkles','--other','Loaded'],think:['brain','--thinking','Thought'],read:['file-text','--explore','Read'],search:['search','--explore','Searched'],edit:['pencil','--edit','Edited'],bash:['terminal','--shell','Ran'],msg:['message-square','--textc','']};
const STEPS=[
 {k:'think',text:'They want the log redesigned; load tsp, then find the component',d:'4s',w:5,at:'0:00'},
 {k:'skill',subj:'tsp',d:'380ms',w:1,at:'0:04'},
 {k:'read',subj:'chat/TurnActivity.svelte',d:'31ms',w:2,at:'0:05'},
 {k:'search',subj:'"Loaded" in src/lib/frontend',d:'210ms',w:3,at:'0:05'},
 {k:'read',subj:'chat/ActivityRow.svelte',d:'22ms',w:2,at:'0:06'},
 {k:'msg',text:'The footer reuses the row indent and icon, so it reads as a step.',d:'3s',w:8,at:'0:08'},
 {k:'skill',subj:'brainstorm',d:'290ms',w:1,at:'1:12'},
 {k:'edit',subj:'chat/TurnActivity.svelte',d:'1s',w:5,at:'1:13'},
 {k:'bash',subj:'pnpm check',d:'38s',w:18,fail:1,at:'1:20'},
 {k:'bash',subj:'pnpm check',d:'41s',w:20,at:'2:01'},
 {k:'compact',at:'3:00'},
 {k:'edit',subj:'chat/ActivityRow.svelte',d:'900ms',w:6,at:'3:58'},
];
const LIVE=STEPS.slice(0,10);
const SK=['tsp','brainstorm'];
const PHRASE='2 reads · 1 search · 2 edits · 2 commands';
const ico=(n,c,cls='')=>`<span class="ic ${cls}" style="color:var(${c})"><i data-lucide="${n}"></i></span>`;
const skillPill=n=>`<span class="pill sk">${ico('sparkles','--other','sm')}<span class="mono" style="font-size:11.5px">${n}</span></span>`;
function row(s,o={}){
 if(s.k==='compact')return `<div class="rule"><span>Compacted context</span><span class="mono">182k → 41k</span><span class="saved">· <b style="color:var(--text2);font-weight:500">141k saved</b></span></div>`;
 if(s.k==='skill'&&o.skill==='event')return `<div class="row">${o.noIcon?'':ico('sparkles','--other')}<span class="verb">Skill</span><span class="subj" style="color:var(--other)">${s.subj}</span></div>`;
 if(s.k==='skill'&&o.skill==='pill')return `<div class="row">${skillPill(s.subj)}<span class="evtx">skill loaded</span></div>`;
 const [n,c,v]=K[s.k];
 const col=s.fail?'--fail':o.live?'--accent':c;
 const icon=o.noIcon?'':ico(n,col);
 const tail=o.live?'<span class="blk"></span>':s.fail?ico('circle-alert','--error','sm'):'';
 if(s.k==='think')return `<div class="row">${icon}<span class="verb" style="font-weight:500">Thought</span><span class="subj it">${s.text}</span><time>${s.d}</time></div>`;
 if(s.k==='msg')return `<div class="row">${icon}<span class="msg">${s.text}</span><time>${s.d}</time></div>`;
 return `<div class="row">${icon}<span class="verb">${o.live?'Running':(o.verb??v)}</span><span class="subj">${s.subj}</span>${o.live?'':`<time>${s.d}</time>`}${tail}</div>`;
}
function strip(steps,o={}){
 const tot=steps.reduce((a,s)=>a+(s.w||0),0);let acc=0;const ticks=[];
 const segs=steps.map((s,i)=>{
  if(s.k==='compact')return '<i class="seam"></i>';
  if(s.k==='skill'&&o.ticks)ticks.push({n:s.subj,l:(acc+s.w/2)/tot*100});
  acc+=s.w;
  const live=o.live&&i===steps.length-1;
  const col=s.fail?'--fail':live?'--accent':K[s.k][1];
  return `<i class="${live?'live':''}" style="flex:${s.w} 1 0;background:var(${col})"></i>`}).join('');
 const tk=ticks.map(t=>`<span class="tick" style="left:${t.l}%"><span class="dm"></span>${o.ticks==='label'?`<span class="tl2 mono">${t.n}</span>`:''}</span>`).join('');
 return `<div class="stripw ${o.ticks==='label'?'lab':''}"><div class="strip">${segs}</div>${tk}</div>`;
}
function head(o={}){
 const lead=o.live?`<span class="spin"><i data-lucide="loader-circle"></i></span><span class="w">Working</span><span class="dur">1m 31s</span>`
  :`<span class="chev"><i data-lucide="${o.open?'chevron-down':'chevron-right'}"></i></span><span class="w">Worked</span><span class="dur">4m 12s</span>`;
 const ph=o.phrase===''?'':`<span class="ph">· ${o.phrase??PHRASE}</span>`;
 return `<div class="hl">${lead}${ph}${o.right?`<span class="hr">${o.right}</span>`:''}</div>`;

const BILL=`<span class="bill"><span>$0.4123</span><span class="sep">·</span><span>1.2M in</span><span class="sep">·</span><span>18k out</span><span class="sep">·</span><span>ctx <span class="gauge"><b></b></span> 41%</span></span>`;

const M={
 1:{n:1,c:'--finding',g:'●',tag:'Finding',at:'0:08',text:'The footer reuses the row indent and icon, so it reads as a step.'},
 2:{n:2,c:'--ask',g:'?',tag:'Ask',at:'1:10',ask:1,text:'Keep a skill counter at all, or only mark skills where they loaded? <b>I’ll carry on with the second for now.</b>'},
 3:{n:3,c:'--decision',g:'◆',tag:'Decision',at:'1:58',text:'Treating each skill load as an event with a name and a time, not a span.'},
 4:{n:4,c:'--risk',g:'!',tag:'Risk',at:'3:02',text:'Compaction dropped my notes on ActivityRow, so I re-read it before editing.'},
 5:{n:5,c:'--milestone',g:'●',tag:'Done',at:'4:10',text:'Both drafts are on the tsp page, with every state on desktop and phone.'}};
const LV={final:[5],key:[2,4,5],balanced:[2,3,4,5],all:[1,2,3,4,5]};
const msg=(n,d,w)=>({k:'msg',m:n,text:M[n].text,at:M[n].at,d,w});
const STEPS2=[
 STEPS[0],STEPS[1],STEPS[2],STEPS[3],STEPS[4],msg(1,'3s',6),msg(2,'2s',4),
 {k:'skill',subj:'brainstorm',d:'290ms',w:1,at:'1:12'},
 {k:'edit',subj:'chat/TurnActivity.svelte',d:'1s',w:5,at:'1:13'},
 {k:'bash',subj:'pnpm check',d:'38s',w:18,fail:1,at:'1:20'},
 msg(3,'2s',3),
 {k:'bash',subj:'pnpm check',d:'41s',w:20,at:'2:01'},
 {k:'compact',at:'3:00'},msg(4,'2s',3),
 {k:'edit',subj:'chat/ActivityRow.svelte',d:'900ms',w:6,at:'3:58'},msg(5,'2s',3)];
const LIVE2=STEPS2.slice(0,12);
const mb=m=>`<span class="mb" style="--c:var(${m.c})">${m.g} ${m.n}</span>`;
const lu=n=>`<i data-lucide="${n}"></i>`;
function row2(s,o={}){
 if(!s.m)return row(s,{...o,skill:'event'});
 return `<div class="row">${mb(M[s.m])}<span class="msg" style="font-style:normal">${s.text.replace(/<\/?b>/g,'')}</span><time>${s.d}</time></div>`;
}
const ticker2=()=>LIVE2.slice(-3).map((s,i)=>row2(s,{live:i===2})).join('');
function popover(steps,i,x,live){
 const s=steps[i];const real=steps.filter(t=>t.k!=='compact');
 let line,fine;
 if(s.m){const m=M[s.m];line=`${mb(m)}<span class="ptx">${m.text.replace(/<\/?b>/g,'')}</span><span class="pat">${s.at}</span>`;fine=m.ask?'<span style="color:var(--ask)">Needs reply</span> · click to open':'Click to open';}
 else{const [n,c,v]=K[s.k];const run=live&&i===steps.length-1;
  line=`${ico(n,s.fail?'--fail':run?'--accent':c)}<span class="v2">${run?'Running':v}</span><span class="ptx mono">${s.subj}</span><span class="dur">${run?'31s so far':s.d}</span>${s.fail?'<span class="perr">failed</span>':''}<span class="pat">${s.at}</span>`;
  fine=`Step ${real.indexOf(s)+1}${live?'':' of '+real.length} · click to open it in the log`;}
 return `<span class="cur" style="--x:${x}%"></span><span class="caret" style="--x:${x}%"></span><div class="pop" style="--x:${x}%"><div class="pl">${line}</div><div class="pfine">${fine}</div></div>`;
}
function strip2(steps,o={}){
 const tot=steps.reduce((a,s)=>a+(s.w||0),0);let acc=0;const xs=[];
 const segs=steps.map((s,i)=>{
  if(s.k==='compact'){xs.push(acc/tot*100);return '<i class="seam"></i>';}
  xs.push((acc+s.w/2)/tot*100);acc+=s.w;
  const live=o.live&&i===steps.length-1;
  return `<i class="${live?'live':''}" style="flex:${s.w} 1 0;background:var(${s.fail?'--fail':live?'--accent':K[s.k][1]})"></i>`}).join('');
 const ms=steps.map((s,i)=>s.m?{...M[s.m],x:xs[i]}:null).filter(Boolean);
 const dots=o.dots?ms.map(m=>`<span class="mdot ${m.ask?'ring':''}" style="--x:${m.x}%;--c:var(${m.c})"></span>`).join(''):'';
 const pins=o.pins?ms.filter(m=>o.pins.includes(m.n)).map(m=>`<span class="pin ${m.n===o.pinOn?'on':''}" style="--x:${m.x}%;--c:var(${m.c})"><span class="pc"><b>${m.g}</b><span class="n">${m.n}</span></span><span class="ps"></span></span>`).join(''):'';
 const hv=o.hover!=null?popover(steps,o.hover,xs[o.hover],o.live):'';
 return `<div class="stripw ${o.pins?'pins':''}"><div class="strip">${segs}</div>${dots}${pins}${hv}</div>`;
}
function headJ(o={}){
 const lead=o.live?`<span class="spin">${lu('loader-circle')}</span><span class="w">Working</span><span class="dur">1m 31s</span>`
  :`<span class="chev">${lu(o.open?'chevron-down':'chevron-right')}</span><span class="w">Worked</span><span class="dur">4m 12s</span>`;
 return `<div class="hl">${lead}<span class="ph jh">· ${PHRASE} · 2 skills</span><span class="chip ask">? #2</span><span class="chip unr">${o.live?2:3} unread</span>${o.right?`<span class="hr">${o.right}</span>`:''}</div>`;
}
const lv=(on,steps)=>`<span class="seg ${steps?'dial':''}">${[['final','Final'],['key','Key'],['balanced','Balanced'],['all','All']].map(([k,l])=>`<span class="${on===k?'on':''}">${l}<span class="ct">${LV[k].length}</span></span>`).join('')}${steps?`<span class="dv"></span><span class="${on==='steps'?'on':''}">Steps<span class="ct">15</span></span>`:''}</span>`;
const lvrow=(on,extra='',end='4:12',dial=0)=>`<div class="lvrow"><span class="t">0:00</span>${lv(on,dial)}<span class="t">${end}</span>${extra}</div>`;
function jev(m,pos,live){
 return `<div class="jc ${m.ask?'ask':''}"><div class="jtop"><span class="tag" style="--c:var(${m.c})">${m.g} ${m.tag}</span>${m.ask?'<span class="tag" style="--c:var(--ask)">Needs reply</span>':''}${live?'<span class="tag" style="--c:var(--accent)">Following latest</span>':''}<span class="jmeta">#${m.n} · ${m.at} · ${pos}</span></div><div class="jtx">${m.text}</div><div class="jact"><span class="btn">${lu('reply')}Reply</span><span class="btn">${lu('arrow-down')}Lower</span><span class="btn rt">${lu('repeat-2')}Retype</span><span class="nav"><span>${lu('chevron-left')}</span><span>${lu('chevron-right')}</span><span>${lu('x')}</span></span></div></div>`;
}
const tabs3=(on,live)=>`<span class="seg"><span class="${on==='m'?'on':''}">Messages<span class="ct">${live?3:5}</span></span><span class="${on==='s'?'on':''}">Steps<span class="ct">${live?11:15}</span></span><span class="${on==='u'?'on':''}">Usage</span></span>`;
const allRows=()=>STEPS2.map(s=>row2(s)).join('');

D.popover=p=>{
 const card=(o,steps,i)=>`<div class="hov"><div class="card">${headJ(o)}${strip2(steps,{live:o.live,dots:1,hover:i})}</div></div>`;

 return state('Collapsed',`<div class="hov">${P({hover:6})}</div>`,'hovering the Ask on the strip')

D.jevsheet=p=>{

D.ftabs=p=>{

D.dial=p=>{
