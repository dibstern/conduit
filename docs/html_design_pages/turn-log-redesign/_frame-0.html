<!doctype html><html><head><meta charset="utf-8"><script>(()=>{let t;try{t=parent!==window&&parent.document.documentElement.dataset.designTheme}catch(e){}t=t||localStorage.getItem('tsp-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const h=document.documentElement;h.dataset.theme=t;h.style.setProperty('color-scheme',t,'important')})()</script><style>body{margin:0}html:not([data-theme=dark]) [data-theme-only=dark],html[data-theme=dark] [data-theme-only=light]{display:none!important}</style><meta name="viewport" content="width=820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:light-dark(#fff,#111113); --turn-bg:light-dark(#f4f4f6,#1a1a1d); --raised:light-dark(#fff,#1d1d21);
  --well:light-dark(#e9e9ed,#0c0c0e); --zebra:light-dark(#fafafb,#151517);
  --text:light-dark(#0b0b0d,#ededf0); --text2:light-dark(#5d5d66,#a1a1aa); --dim:light-dark(#868692,#6e6e77);
  --border:light-dark(#e3e3e7,#2b2b31); --chip:light-dark(rgba(0,0,0,.05),rgba(255,255,255,.07)); --sel:light-dark(#ececef,#202024);
  --explore:light-dark(#0369a1,#38bdf8); --edit:light-dark(#a87e00,#d9a521); --shell:light-dark(#15803d,#4ade80);
  --other:light-dark(#3f40b2,#818cf8); --thinking:light-dark(#7441ff,#b07cff); --textc:light-dark(#c0267f,#f472b6);
  --fail:light-dark(#ff3b62,#ff4f73); --error:light-dark(#bc1f1f,#ff6369); --accent:light-dark(#4352d2,#8e9bff);
  --success:light-dark(#127136,#3ecf8e);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Geist,system-ui,sans-serif;padding:22px 30px 8px}
body.phone{padding:18px 14px 6px}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
svg.lucide{width:14px;height:14px;stroke-width:2}
.sm svg.lucide{width:12px;height:12px}
.state{margin-bottom:28px}
.lbl{font:600 10.5px/1 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.card{background:var(--turn-bg);border-radius:14px;padding:10px 12px}
.hl{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.hl .w{font-size:14px;font-weight:600}
.dur{font:12px "Geist Mono",monospace;color:var(--dim)}
.hl .ph{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;min-width:0}
.hl .chev{color:var(--dim);display:flex}
.hr{margin-left:auto;flex:none;padding-left:8px;font:12px "Geist Mono",monospace;color:var(--text2);display:flex;align-items:center;gap:8px}
.spin{color:var(--accent);display:flex;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stripw{position:relative;margin-top:9px}
.stripw.lab{margin-bottom:15px}
.strip{display:flex;gap:2px;height:4px}
.strip i{display:block;height:100%;border-radius:2px}
.strip i.seam{flex:0 0 2px!important;background:var(--text2);height:10px;margin-top:-3px}
.strip i.live{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.tick{position:absolute;top:-3px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.dm{width:6px;height:6px;background:var(--other);transform:rotate(45deg);outline:2px solid var(--turn-bg);border-radius:1px}
.tl2{font-size:10px;color:var(--other);margin-top:4px;white-space:nowrap}
.log{margin-top:6px}
.row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;min-height:26px}
.row .ic{flex:none;display:flex}
.row .verb{color:var(--text2);flex:none}
.row .subj{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px "Geist Mono",monospace;color:var(--dim)}
.row .subj.it{font:italic 13px Geist,sans-serif}
.row .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic;color:var(--text2)}
.row time{margin-left:auto;font:11.5px "Geist Mono",monospace;color:var(--dim);flex:none}
.blk{width:9px;height:9px;flex:none;display:inline-block;background:repeating-linear-gradient(90deg,var(--accent) 0 1.5px,transparent 1.5px 2.5px);animation:breathe .6s steps(2) infinite}
.rule{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;color:var(--dim);white-space:nowrap}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:var(--border)}
.phone .rule .saved{display:none}
.bill{font:12px "Geist Mono",monospace;color:var(--text2);display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.bill .sep{color:var(--dim)}
.gauge{display:inline-block;width:40px;height:4px;border-radius:9px;background:var(--chip);overflow:hidden;vertical-align:middle}
.gauge b{display:block;height:100%;width:41%;background:var(--success)}
.earlier{font-size:12px;color:var(--text2);padding:7px 6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;background:var(--chip);color:var(--text2);font-size:12px;font-weight:500;border:0;white-space:nowrap}
.pill.sk{color:var(--other);background:color-mix(in srgb,var(--other) 13%,transparent)}
.pill.err{color:var(--error);background:color-mix(in srgb,var(--error) 12%,transparent)}
.evtx{font-size:12px;color:var(--dim)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.mright{margin-left:auto}
.mrow{flex-basis:100%;margin-top:2px}
.flag{outline:1.5px dashed var(--fail);outline-offset:3px;border-radius:6px}
.note{font-size:11.5px;color:var(--fail);margin:7px 0 0 2px}
/* 2 panel */
.panel{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg)}
.panel .top{background:var(--turn-bg);padding:10px 12px}
.pbody{padding:6px;border-top:1px solid var(--border)}
.pfoot{background:var(--turn-bg);border-top:1px solid var(--border);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
/* 3 well */
.well{margin:12px -6px -4px;background:var(--well);border-radius:10px;box-shadow:inset 0 1px 3px light-dark(rgba(0,0,0,.09),rgba(0,0,0,.6));padding:4px}
.well .row{min-height:24px;padding:3px 6px}
.wfoot{display:flex;justify-content:flex-end;padding:8px 6px 4px;border-top:1px dashed var(--border);margin-top:4px}
.phone .wfoot{justify-content:flex-start}
/* 4 rail */
.tl{position:relative;margin:10px 0 0 9px;padding-left:16px}
.tl::before{content:"";position:absolute;left:0;top:8px;bottom:12px;width:2px;background:var(--border);border-radius:2px}
.node{position:relative}
.node::before{content:"";position:absolute;left:-19px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.node.dia::before{border-radius:1px;transform:rotate(45deg) scale(.9)}
.node.gap::before{display:none}
.node.pulse::before{animation:breathe 1.2s ease-in-out infinite}
.node.cap::before{width:10px;height:10px;left:-20px;top:10px;background:var(--bg);border:2px solid var(--c)}
.capr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 6px;min-height:30px}
.capr .w2{font-weight:600}
/* 5 table */
.tbl{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:8px}
.tr{display:grid;grid-template-columns:44px 16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 12px;min-height:30px}
.phone .tr{grid-template-columns:34px 14px minmax(0,1fr) auto;gap:6px;padding:5px 10px}
.tr:nth-child(even){background:var(--zebra)}
.tr .ic{display:flex}
.tr .off{font-size:11px;color:var(--dim)}
.tr .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .v2{color:var(--text2)}
.tr .s2{font-size:12px;color:var(--dim)}
.tr .it2{font-style:italic;color:var(--text2)}
.tr .took{font:11.5px "Geist Mono",monospace;color:var(--dim);display:flex;gap:5px;align-items:center}
.tr.th{font:600 10px Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--turn-bg)!important;min-height:26px}
.tr.run{background:color-mix(in srgb,var(--accent) 9%,transparent)!important}
.tr.full{display:block;padding:0 12px}
.tr.ear{display:block;color:var(--text2);font-size:12px}
.tfoot{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:8px 12px;background:var(--turn-bg);border-top:1px solid var(--border)}
.tfoot .w2{font-weight:600}
/* 6 sheet */
.sheet{background:var(--raised);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px -12px light-dark(rgba(0,0,0,.22),rgba(0,0,0,.7));padding:10px 12px 8px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px;gap:2px}
.seg span{font:500 12px Geist,sans-serif;color:var(--text2);padding:3px 10px;border-radius:7px}
.seg .on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .ct{color:var(--dim);font-family:"Geist Mono",monospace;font-size:11px;margin-left:3px}
.sbody{margin:8px -6px 0;border-top:1px solid var(--border);padding-top:6px}
.usage{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 18px;padding:10px 6px 6px}
.uk{font:600 10px Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.uv{font:13px "Geist Mono",monospace}
.uw{grid-column:1/-1}
.ul{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.ul .at{margin-left:auto;font:11.5px "Geist Mono",monospace;color:var(--dim)}
.gauge.big{flex:1 1 auto;min-width:90px;max-width:280px;height:6px}
/* 7 gutter */
.gut{margin:6px 0 0 19px;padding-left:8px;border-left:1px solid var(--border)}
</style>
<script>
const K={skill:['sparkles','--other','Loaded'],think:['brain','--thinking','Thought'],read:['file-text','--explore','Read'],search:['search','--explore','Searched'],edit:['pencil','--edit','Edited'],bash:['terminal','--shell','Ran'],msg:['message-square','--textc','']};
const STEPS=[
 {k:'think',text:'They want the log redesigned; load tsp, then find the component',d:'4s',w:5,at:'0:00'},
 {k:'skill',subj:'tsp',d:'380ms',w:1,at:'0:04'},
 {k:'read',subj:'chat/TurnActivity.svelte',d:'31ms',w:2,at:'0:05'},
 {k:'search',subj:'"Loaded" in src/lib/frontend',d:'210ms',w:3,at:'0:05'},
 {k:'read',subj:'chat/ActivityRow.svelte',d:'22ms',w:2,at:'0:06'},
 {k:'msg',text:'The footer reuses the row indent and icon, so it reads as a step.',d:'3s',w:8,at:'0:08'},
 {k:'skill',subj:'brainstorm',d:'290ms',w:1,at:'1:12'},
 {k:'edit',subj:'chat/TurnActivity.svelte',d:'1s',w:5,at:'1:13'},
 {k:'bash',subj:'pnpm check',d:'38s',w:18,fail:1,at:'1:20'},
 {k:'bash',subj:'pnpm check',d:'41s',w:20,at:'2:01'},
 {k:'compact',at:'3:00'},
 {k:'edit',subj:'chat/ActivityRow.svelte',d:'900ms',w:6,at:'3:58'},
];
const LIVE=STEPS.slice(0,10);
const SK=['tsp','brainstorm'];
const PHRASE='2 reads · 1 search · 2 edits · 2 commands';
const ico=(n,c,cls='')=>`<span class="ic ${cls}" style="color:var(${c})"><i data-lucide="${n}"></i></span>`;
const skillPill=n=>`<span class="pill sk">${ico('sparkles','--other','sm')}<span class="mono" style="font-size:11.5px">${n}</span></span>`;
function row(s,o={}){
 if(s.k==='compact')return `<div class="rule"><span>Compacted context</span><span class="mono">182k → 41k</span><span class="saved">· <b style="color:var(--text2);font-weight:500">141k saved</b></span></div>`;
 if(s.k==='skill'&&o.skill==='event')return `<div class="row">${o.noIcon?'':ico('sparkles','--other')}<span class="verb">Skill</span><span class="subj" style="color:var(--other)">${s.subj}</span></div>`;
 if(s.k==='skill'&&o.skill==='pill')return `<div class="row">${skillPill(s.subj)}<span class="evtx">skill loaded</span></div>`;
 const [n,c,v]=K[s.k];
 const col=s.fail?'--fail':o.live?'--accent':c;
 const icon=o.noIcon?'':ico(n,col);
 const tail=o.live?'<span class="blk"></span>':s.fail?ico('circle-alert','--error','sm'):'';
 if(s.k==='think')return `<div class="row">${icon}<span class="verb" style="font-weight:500">Thought</span><span class="subj it">${s.text}</span><time>${s.d}</time></div>`;
 if(s.k==='msg')return `<div class="row">${icon}<span class="msg">${s.text}</span><time>${s.d}</time></div>`;
 return `<div class="row">${icon}<span class="verb">${o.live?'Running':(o.verb??v)}</span><span class="subj">${s.subj}</span>${o.live?'':`<time>${s.d}</time>`}${tail}</div>`;
}
function strip(steps,o={}){
 const tot=steps.reduce((a,s)=>a+(s.w||0),0);let acc=0;const ticks=[];
 const segs=steps.map((s,i)=>{
  if(s.k==='compact')return '<i class="seam"></i>';
  if(s.k==='skill'&&o.ticks)ticks.push({n:s.subj,l:(acc+s.w/2)/tot*100});
  acc+=s.w;
  const live=o.live&&i===steps.length-1;
  const col=s.fail?'--fail':live?'--accent':K[s.k][1];
  return `<i class="${live?'live':''}" style="flex:${s.w} 1 0;background:var(${col})"></i>`}).join('');
 const tk=ticks.map(t=>`<span class="tick" style="left:${t.l}%"><span class="dm"></span>${o.ticks==='label'?`<span class="tl2 mono">${t.n}</span>`:''}</span>`).join('');
 return `<div class="stripw ${o.ticks==='label'?'lab':''}"><div class="strip">${segs}</div>${tk}</div>`;
}
function head(o={}){
 const lead=o.live?`<span class="spin"><i data-lucide="loader-circle"></i></span><span class="w">Working</span><span class="dur">1m 31s</span>`
  :`<span class="chev"><i data-lucide="${o.open?'chevron-down':'chevron-right'}"></i></span><span class="w">Worked</span><span class="dur">4m 12s</span>`;
 const ph=o.phrase===''?'':`<span class="ph">· ${o.phrase??PHRASE}</span>`;
 return `<div class="hl">${lead}${ph}${o.right?`<span class="hr">${o.right}</span>`:''}</div>`;
}
const BILL=`<span class="bill"><span>$0.4123</span><span class="sep">·</span><span>1.2M in</span><span class="sep">·</span><span>18k out</span><span class="sep">·</span><span>ctx <span class="gauge"><b></b></span> 41%</span></span>`;
const LIVEBILL=`<span class="bill"><span>$0.2108</span><span class="sep">·</span><span>640k in</span><span class="sep">·</span><span>9k out</span></span>`;
const earlier=(n=7)=>`<div class="earlier">+ ${n} earlier steps</div>`;
const ticker=(o={})=>LIVE.slice(-3).map((s,i)=>row(s,{...o,live:i===2})).join('');
const state=(label,html,note='')=>`<div class="state"><div class="lbl">${label}${note?`<em>${note}</em>`:''}</div>${html}</div>`;
const three=(c,l,e,notes=[])=>state('Collapsed',c,notes[0])+state('Live',l,notes[1])+state('Expanded',e,notes[2]);

const D={};
D.ledger=p=>{
 const meta=live=>`<div class="meta">${SK.map(skillPill).join('')}<span class="pill err">1 failed</span><span class="${p?'mrow':'mright'}">${live?LIVEBILL:BILL}</span></div>`;
 return three(
  `<div class="card">${head()}${strip(STEPS,{ticks:1})}${meta()}</div>`,
  `<div class="card">${head({live:1})}${strip(LIVE,{live:1,ticks:1})}${meta(1)}</div><div class="log">${earlier()}${ticker()}</div>`,
  `<div class="card">${head({open:1})}${strip(STEPS,{ticks:1})}${meta()}</div><div class="log">${STEPS.map(s=>row(s,{skill:'event'})).join('')}</div>`);
};
D.panel=p=>{
 const top=o=>`<div class="top">${head({...o,phrase:PHRASE+' · 2 skills'})}${strip(o.live?LIVE:STEPS,{live:o.live})}</div>`;
 const foot=live=>`<div class="pfoot"><span class="pill err">1 failed</span><span class="${p?'mrow':'mright'}">${live?LIVEBILL:BILL}</span></div>`;
 return three(
  `<div class="panel">${top({})}</div>`,
  `<div class="panel">${top({live:1})}<div class="pbody">${earlier()}${ticker({skill:'pill'})}</div>${foot(1)}</div>`,
  `<div class="panel">${top({open:1})}<div class="pbody">${STEPS.map(s=>row(s,{skill:'pill'})).join('')}</div>${foot()}</div>`,
  ['','the panel grows down; the footer bar is the panel’s edge, not a row']);
};
D.well=p=>{
 const card=(o,inner='')=>`<div class="card">${head({...o,right:o.live?'$0.21':p?'$0.41':'$0.4123 · ctx 41%'})}${strip(o.live?LIVE:STEPS,{live:o.live,ticks:'label'})}${inner}</div>`;
 return three(
  card({}),
  card({live:1},`<div class="well">${earlier()}${ticker({skill:'event'})}</div>`),
  card({open:1},`<div class="well">${STEPS.map(s=>row(s,{skill:'event'})).join('')}<div class="wfoot">${BILL}</div></div>`),
  ['skills are labelled where they loaded on the strip','the log is a recessed tray inside the card']);
};
D.rail=p=>{
 const node=(s,o={})=>{
  if(s.k==='compact')return `<div class="node gap">${row(s)}</div>`;
  if(s.k==='skill')return `<div class="node dia" style="--c:var(--other)"><div class="row"><span class="mono" style="color:var(--other);font-size:12px;font-weight:500">${s.subj}</span><span class="evtx">skill loaded</span></div></div>`;
  const c=s.fail?'--fail':o.live?'--accent':K[s.k][1];
  return `<div class="node ${o.live?'pulse':''}" style="--c:var(${c})">${row(s,{...o,noIcon:1})}</div>`;
 };
 const card=o=>`<div class="card">${head({...o,phrase:PHRASE+' · 2 skills',right:o.live?'':'$0.41'})}${strip(o.live?LIVE:STEPS,{live:o.live})}</div>`;
 const cap=`<div class="node cap" style="--c:var(--text2)"><div class="capr"><span class="w2">Done</span><span class="dur">4m 12s</span><span class="${p?'mrow':'mright'}">${BILL}</span></div></div>`;
 return three(
  card({}),
  card({live:1})+`<div class="tl">${earlier()}${LIVE.slice(-3).map((s,i)=>node(s,{live:i===2})).join('')}</div>`,
  card({open:1})+`<div class="tl">${STEPS.map(s=>node(s)).join('')}${cap}</div>`,
  ['','no icons: the dot carries the colour, a diamond marks a skill','the rail ends in a “Done” node that carries the bill']);
};
D.table=p=>{
 const tr=(s,o={})=>{
  if(s.k==='compact')return `<div class="tr full">${row(s)}</div>`;
  const [n,c,v]=K[s.k];const col=s.fail?'--fail':o.live?'--accent':c;
  const what=s.k==='think'||s.k==='msg'?`<span class="it2">${s.text}</span>`:`<span class="v2">${s.k==='skill'?'Skill':o.live?'Running':v}</span> <span class="mono s2" ${s.k==='skill'?'style="color:var(--other)"':''}>${s.subj}</span>`;
  const took=s.k==='skill'?'':o.live?'<span class="blk"></span>':s.d+(s.fail?ico('circle-alert','--error','sm'):'');
  return `<div class="tr ${o.live?'run':''}"><span class="mono off">${s.at}</span>${ico(n,col)}<span class="what">${what}</span><span class="took">${took}</span></div>`;
 };
 const th=`<div class="tr th"><span>At</span><span></span><span>Step</span><span>Took</span></div>`;
 const foot=live=>`<div class="tfoot"><span class="w2">${live?'So far':'Total'}</span><span class="dur">${live?'1m 31s':'4m 12s'}</span><span class="${p?'mrow':'mright'}">${live?LIVEBILL:BILL}</span></div>`;
 const card=o=>`<div class="card">${head({...o,right:o.live?'':'$0.41'})}${strip(o.live?LIVE:STEPS,{live:o.live})}</div>`;
 return three(
  card({}),
  card({live:1})+`<div class="tbl">${th}<div class="tr ear">+ 7 earlier steps</div>${LIVE.slice(-3).map((s,i)=>tr(s,{live:i===2})).join('')}${foot(1)}</div>`,
  card({open:1})+`<div class="tbl">${th}${STEPS.map(s=>tr(s)).join('')}${foot()}</div>`,
  ['','“At” is time into the turn, so a skill is a moment, not a span','totals are the table’s footer row']);
};
D.sheet=p=>{
 const tabs=on=>`<span class="seg"><span class="${on==='s'?'on':''}">Steps<span class="ct">12</span></span><span class="${on==='u'?'on':''}">Usage</span></span>`;
 const top=(o,on)=>p?`${head(o)}${strip(o.live?LIVE:STEPS,{live:o.live})}<div style="margin-top:10px">${tabs(on)}</div>`:`${head({...o,right:tabs(on)})}${strip(o.live?LIVE:STEPS,{live:o.live})}`;
 const usage=`<div class="usage">
  <div><div class="uk">Cost</div><div class="uv">$0.4123</div></div>
  <div><div class="uk">Tokens</div><div class="uv">1.2M in · 18k out</div></div>
  <div class="uw"><div class="uk">Context at end</div><div class="uv" style="display:flex;align-items:center;gap:10px"><span class="gauge big"><b></b></span><span style="white-space:nowrap">41% · 82k / 200k</span></div></div>
  <div class="uw"><div class="uk">Skills loaded</div>${STEPS.filter(s=>s.k==='skill').map(s=>`<div class="ul">${skillPill(s.subj)}<span class="at">at ${s.at}</span></div>`).join('')}</div>
  <div class="uw"><div class="uk">Worth a look</div>
   <div class="ul">${ico('circle-alert','--error')}<span>1 failed step · <span class="mono" style="font-size:12px">pnpm check</span></span><span class="at">at 1:20</span></div>
   <div class="ul">${ico('minimize','--text2')}<span>Context compacted · 141k saved</span><span class="at">at 3:00</span></div></div></div>`;
 return three(
  `<div class="card">${head({})}${strip(STEPS)}</div>`,
  `<div class="sheet">${top({live:1},'s')}<div class="sbody">${earlier()}${ticker({skill:'event'})}</div></div>`,
  `<div class="sheet">${top({open:1},'s')}<div class="sbody">${STEPS.map(s=>row(s,{skill:'event'})).join('')}</div></div>`,
  ['unchanged','opening lifts the card into a raised sheet','Steps tab: only steps, nothing else'])
  +state('Expanded, Usage tab',`<div class="sheet">${top({open:1},'u')}<div class="sbody">${usage}</div></div>`,'skills, cost, context, failures and compaction in one place');
};
D.gutter=p=>{
 const card=o=>`<div class="card">${head({...o,phrase:PHRASE+' · 2 skills',right:o.live?'$0.21':'$0.41'})}${strip(o.live?LIVE:STEPS,{live:o.live})}</div>`;
 return three(
  card({}),
  card({live:1})+`<div class="gut">${earlier()}${ticker({skill:'event'})}</div>`,
  card({open:1})+`<div class="gut">${STEPS.map(s=>row(s,{skill:'event'})).join('')}</div>`,
  ['the bill shrinks to its cost; the full bill lives in the hover','',"a hairline hangs the log off the card; nothing follows the last step"]);
};
D.today=p=>{
 const foot=live=>`<div class="flag" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;font-size:12px;color:var(--text2)"><span style="display:inline-flex;gap:5px;align-items:center"><span class="sm" style="display:flex"><i data-lucide="sparkles"></i></span>2 skills</span>${live?'':'<span>compacted</span>'}<span style="color:var(--error)">1 failed</span>${live?LIVEBILL:BILL}</div>`;
 return three(
  `<div class="card">${head()}${strip(STEPS)}</div>`,
  `<div class="card">${head({live:1})}${strip(LIVE,{live:1})}</div><div class="log"><div class="earlier">+ 7 earlier messages</div>${ticker()}${foot(1)}</div>`,
  `<div class="card">${head({open:1})}${strip(STEPS)}</div><div class="log">${STEPS.map(s=>row(s)).join('')}${foot()}</div>`,
  ['','the footer reads as the next step','“✦ 2 skills” reads as step 13']);
};
function show(key,phone){if(phone)document.body.classList.add('phone');const d=document.createElement('div');d.innerHTML=D[key](!!phone);document.body.prepend(d);lucide.createIcons();}
</script>
</head><body><script>show('today')</script></body></html>
