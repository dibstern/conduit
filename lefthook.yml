# Lefthook must not rewrite the hooks on `lefthook run`: core.hooksPath is the
# tracked .beads/hooks, whose pre-commit is generated by
# scripts/install-git-hooks.mjs so Beads runs after the gate.
no_auto_install: true

pre-commit:
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm check
    test:
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
      run: pnpm test
    build:
      run: pnpm build
