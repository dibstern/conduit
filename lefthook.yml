# Lefthook must not rewrite the hooks on `lefthook run`: core.hooksPath is the
# tracked .beads/hooks, whose pre-commit is generated by
# scripts/install-git-hooks.mjs so Beads runs after the gate.
no_auto_install: true

pre-commit:
  parallel: true
  commands:
    lint:
      # Biome sees only the files being committed, so another session's
      # unformatted work in progress cannot block this commit.
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    lint-rules:
      run: pnpm lint:rules
    typecheck:
      run: pnpm exec tsgo --noEmit
    typecheck-frontend:
      run: pnpm check:frontend
    typecheck-svelte:
      run: pnpm check:svelte
    test:
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
      # Lefthook omits deleted files; unrelated inputs pass with no tests.
      run: pnpm exec vitest related --run {staged_files}
    test-guards:
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
        # Its own Vite cache, so a cold start cannot race the test command's.
        CONDUIT_VITEST_CACHE_DIR: node_modules/.vite-guards
      # No file template: guards also run for docs-only and deletion-only commits.
      run: pnpm exec vitest run --project guards
    build:
      run: pnpm build
